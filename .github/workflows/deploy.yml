name: Deploy to GitHub Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build Vite App for GitHub Pages
        run: npm run build
        env:
          VITE_BASE_PATH: '/erpgais/'
          VITE_SUPABASE_URL: 'https://uegrjghtheviiswgoiuy.supabase.co'
          VITE_SUPABASE_ANON_KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVlZ3JqZ2h0aGV2aWlzd2dvaXV5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYxNzQ1NjMsImV4cCI6MjEwMTc1MDU2M30.ORc7O5CIxPHotHkQZn20uOgsxxr-l-GPiLG9Wb_Vrfo'

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
